<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8a65">
<title>FamiChibi</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<link rel="stylesheet" href="/stage/stage.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- Onboarding -->
  <section id="view-onboard" class="view" hidden>
    <div class="onboard card">
      <div class="logo"><span>🏠</span> FamiChibi</div>
      <p class="tagline">家族がいつでもそこにいる。<br>ちびっこが、家族の言葉を届けます。</p>
      <div id="invite-banner" class="invite-banner" hidden></div>
      <label class="field"><span>あなたの名前</span><input id="ob-name" maxlength="24" placeholder="例: りんたろう" autocomplete="nickname"></label>
      <div class="field"><span>ちびっこ（アバター）を選ぶ</span><div id="ob-avatars" class="avatar-grid"></div></div>
      <button id="ob-go" class="btn primary big">はじめる</button>
    </div>
  </section>

  <!-- Family list -->
  <section id="view-home" class="view" hidden>
    <header class="topbar">
      <div class="logo small"><span>🏠</span> FamiChibi</div>
      <div class="grow"></div>
      <button class="icon-btn" id="theme-toggle" title="テーマ切替">🌓</button>
    </header>
    <div class="home-wrap">
      <h1 class="hello">おかえりなさい、<span id="home-name"></span></h1>
      <div id="family-list" class="family-list"></div>
      <div class="home-actions">
        <div class="card mini-form">
          <h3>家族サーバーを作る</h3>
          <div class="row"><input id="cf-emoji" value="🏠" maxlength="2" class="emoji-in"><input id="cf-name" placeholder="例: しげの家"></div>
          <input id="cf-nick" placeholder="家族内での呼び名（例: 兄）">
          <button class="btn primary" id="cf-go">作成</button>
        </div>
        <div class="card mini-form">
          <h3>招待コードで参加</h3>
          <input id="jf-code" placeholder="6文字のコード" maxlength="6" class="code-in">
          <input id="jf-nick" placeholder="家族内での呼び名（例: 妹）">
          <button class="btn primary" id="jf-go">参加</button>
        </div>
        <div class="card mini-form demo-card">
          <h3>🎬 デモ家族</h3>
          <p class="muted">ママ・妹・パパ（仮想メンバー）と予定・チャット履歴入りの家族を作ります。</p>
          <button class="btn" id="demo-seed">デモ家族を作成</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Family view -->
  <section id="view-family" class="view" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <button class="icon-btn" id="back-home" title="家族一覧">←</button>
        <div class="fam-title"><span id="fam-emoji"></span><b id="fam-name"></b></div>
      </div>
      <div class="side-section"><h4>チャンネル</h4><div id="channel-list"></div>
        <button class="link-btn" id="add-channel">＋ チャンネルを追加</button></div>
      <div class="side-section" id="voice-panel" hidden></div>
      <div class="side-section"><h4>家族</h4><div id="member-list"></div></div>
      <div class="side-foot"><span class="muted">招待コード</span> <code id="fam-code"></code></div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main">
      <header class="topbar fam-bar">
        <button class="icon-btn mobile-only" id="open-side">☰</button>
        <div class="fam-title mobile-only"><span id="fam-emoji-m"></span><b id="fam-name-m"></b></div>
        <nav class="tabs" id="tabs">
          <button data-tab="chat" class="active">💬<span>チャット</span></button>
          <button data-tab="memo">🧊<span>冷蔵庫メモ</span></button>
          <button data-tab="cal">📅<span>カレンダー</span></button>
          <button data-tab="task">✅<span>やること</span></button>
          <button data-tab="home">💡<span>おうち</span></button>
          <button data-tab="settings">⚙️<span>設定</span></button>
        </nav>
        <div class="grow"></div>
        <button class="icon-btn" id="demo-fab" title="デモディレクター">🎬</button>
        <button class="icon-btn" id="tts-toggle" title="読み上げ">🔊</button>
        <button class="icon-btn" id="stage-toggle" title="リビングの表示">🧸</button>
        <button class="icon-btn" id="theme-toggle2" title="テーマ切替">🌓</button>
      </header>
      <div class="living" id="living">
        <div class="living-bg"></div>
        <div id="stage"></div>
        <div class="living-label">🛋️ リビング <span id="stage-status" class="muted"></span></div>
        <div id="party-banner" class="party-banner" hidden></div>
      </div>
      <div class="panes">
        <section class="pane" id="pane-chat">
          <div class="chat-head"><b id="chan-name"></b><span id="typing" class="typing"></span></div>
          <div class="messages" id="messages"></div>
          <div class="quick" id="quick"></div>
          <form class="composer" id="composer">
            <button type="button" class="icon-btn" id="rec-btn" title="ボイスメッセージ">🎤</button>
            <input id="msg-in" autocomplete="off" placeholder="メッセージ（@ちびAI で AIに頼む）">
            <button class="btn primary send" id="send-btn">送信</button>
          </form>
        </section>
        <section class="pane" id="pane-voice" hidden></section>
        <section class="pane" id="pane-memo" hidden></section>
        <section class="pane" id="pane-cal" hidden></section>
        <section class="pane" id="pane-task" hidden></section>
        <section class="pane" id="pane-home" hidden></section>
        <section class="pane" id="pane-settings" hidden></section>
      </div>
    </main>
    <div class="drawer" id="demo-drawer" hidden>
      <div class="drawer-head"><b>🎬 デモディレクター</b><button class="icon-btn" id="demo-close">✕</button></div>
      <p class="muted small">企画書のシナリオをワンタップで再現します（仮想メンバーが送信）。</p>
      <div id="demo-buttons" class="demo-buttons"></div>
      <form id="demo-say" class="demo-say">
        <select id="demo-nick"><option>母</option><option>妹</option><option>父</option></select>
        <input id="demo-text" placeholder="仮想メンバーに言わせる">
        <button class="btn">送信</button>
      </form>
    </div>
  </section>
</div>
<div id="toasts"></div>
<dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
<script src="/stage/chibi-stage.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
