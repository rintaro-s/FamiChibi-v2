<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chibi Stage</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="stage"></div>
<script src="chibi-stage.js"></script>
<script>
  // Auto-init; configuration may come from the query string (?layout=row&fraction=0.6&fps=30)
  (function () {
    const q = new URLSearchParams(location.search);
    Chibi.init({
      layout: q.get('layout') || 'single',
      modelFraction: parseFloat(q.get('fraction') || '1'),
      fps: parseInt(q.get('fps') || '30', 10),
      fontScale: parseFloat(q.get('font') || '1'),
      theme: q.get('theme') || 'light',
      maxTexture: parseInt(q.get('tex') || '1024', 10),
    });
  })();
</script>
</body>
</html>
